name: guard9s CI
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: guard9s-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Module integrity
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format
        run: make fmt-check
      - name: Vet
        run: go vet ./...
      - name: Unit and interaction tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Core coverage (minimum 90%)
        run: make coverage
      - name: Build single binary
        run: make build
      - name: Live-test syntax, help and disabled guard (no cluster)
        run: make live-test-guard
      - name: Short fuzz smoke (synthetic corpus)
        run: |
          go test ./internal/analyzer -run '^$' -fuzz '^FuzzSelectorsAndTolerations$' -fuzztime=2s -parallel=2
          go test ./internal/analyzer -run '^$' -fuzz '^FuzzExistingAntiAffinityPrefilter$' -fuzztime=2s -parallel=2
          go test ./internal/ui -run '^$' -fuzz '^FuzzFilterParser$' -fuzztime=2s -parallel=2
          go test ./internal/report -run '^$' -fuzz '^FuzzRedactionAndSerialization$' -fuzztime=2s -parallel=2
      - name: Synthetic scaling benchmarks (no timing threshold)
        run: GOMAXPROCS=2 go test ./... -run '^$' -bench=. -benchmem -benchtime=1x
      - name: Offline smoke check
        env:
          KUBECONFIG: /nonexistent/guard9s-demo-config
          TERM: ''
        run: |
          ./bin/guard9s --help
          ./bin/guard9s --version
          ./bin/guard9s --demo --node worker-01 --output json > /tmp/guard9s-report.json
          ./bin/guard9s --demo --demo-scenario healthy --node worker-01 --output markdown > /tmp/guard9s-report.md
          ./bin/guard9s --demo --demo-scenario scheduling --node worker-01 --output json --redact > /tmp/guard9s-redacted.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/guard9s-report.json').read_text())
          assert report['schemaVersion'] == 'guard9s/v1'
          assert report['readiness'] == 'BLOCKED' and report['readOnly']
          assert "' drain '" not in report['plan']
          assert "' drain '" in Path('/tmp/guard9s-report.md').read_text()
          redacted = json.loads(Path('/tmp/guard9s-redacted.json').read_text())
          assert redacted['redaction'] == 'basic' and redacted['node'] == 'node-001'
          assert redacted['readOnly'] and redacted['schedulingCandidates']
          assert 'worker-01' not in Path('/tmp/guard9s-redacted.json').read_text()
          PY

  guard9s-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: '1.35.8'
            image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          - kubernetes: '1.34.11'
            image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Install pinned kind with checksum verification
        run: |
          curl --fail --silent --show-error --location -o /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl --fail --silent --show-error --location -o /tmp/kind.sha256sum https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          expected=$(cut -d' ' -f1 /tmp/kind.sha256sum)
          printf '%s  /tmp/kind\n' "$expected" | sha256sum --check
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version
      - name: Disposable three-node kind E2E
        env:
          GUARD9S_KIND_E2E: '1'
          GUARD9S_KIND_IMAGE: ${{ matrix.image }}
        run: bash hack/kind-e2e.sh
      - name: Sanitized integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard9s-e2e-${{ matrix.kubernetes }}
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  release-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Install pinned GoReleaser with checksum verification
        run: |
          curl --fail --silent --show-error --location -o /tmp/goreleaser_Linux_x86_64.tar.gz https://github.com/goreleaser/goreleaser/releases/download/v2.18.2/goreleaser_Linux_x86_64.tar.gz
          curl --fail --silent --show-error --location -o /tmp/goreleaser-checksums.txt https://github.com/goreleaser/goreleaser/releases/download/v2.18.2/checksums.txt
          cd /tmp
          grep '  goreleaser_Linux_x86_64.tar.gz$' goreleaser-checksums.txt | sha256sum --check
          tar -xzf goreleaser_Linux_x86_64.tar.gz goreleaser
          sudo install -m 0755 goreleaser /usr/local/bin/goreleaser
      - name: Release snapshot (no publication)
        run: |
          goreleaser release --snapshot --clean
          (cd dist && sha256sum --check checksums.txt)
          ./dist/guard9s_linux_amd64_v1/guard9s --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard9s-release-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7
